[project]
name = "resume_screener"
version = "0.1.0"
description = "resume_screener using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.18,<2.0.0",
    "icalendar>=7.3.0",
    "pypdf>=6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
