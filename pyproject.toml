[project]
name = "resume_screener"
version = "0.1.0"
description = "resume_screener using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai[tools]>=1.15.18,<2.0.0",
    "deepeval>=3.9.6",
    "icalendar>=7.3.0",
    "mail-parser-reply>=1.36",
    "ollama>=0.6.3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "replies.jsonc", "tools"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "caf178c3-8df1-42b5-aed2-b5cce76f79c0"
